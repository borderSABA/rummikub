<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>RUMMIKUB ONLINE</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<header id="topbar">
  <div class="top-actions"><button id="rulesBtn" class="top-btn">ルール</button><button id="termsBtn" class="top-btn">用語</button><button id="logBtn" class="top-btn">ログ</button></div>
  <div class="top-center"><span id="mobileInitialStatus" class="mobile-initial-status hidden"></span><div id="topTimer" class="top-timer"></div></div>
  <div class="top-right"><span id="mobilePoolText" class="mobile-pool-text"></span><button id="topLeaveBtn" class="top-btn danger-btn hidden">退出</button><div class="ver">v0.2.4</div></div>
</header>
<main>
  <section id="titleScreen" class="screen active">
    <div class="panel title-panel">
      <label>名前 <input id="nameInput" maxlength="16" autocomplete="nickname" /></label>
      <div id="roomGrid" class="room-grid"></div>
    </div>
  </section>

  <section id="lobbyScreen" class="screen">
    <div class="panel lobby-panel">
      <div class="row spread"><h2 id="lobbyRoomTitle">ROOM</h2></div>
      <div id="lobbyPlayers" class="lobby-players"></div>
      <div id="hostControls" class="host-controls hidden">
        <div class="row gap">
          <button id="addCpuBtn">CPU追加</button>
          <select id="cpuLevel"><option value="1">CPU Lv1</option><option value="2">CPU Lv2</option><option value="3">CPU Lv3</option><option value="4">CPU Lv4</option></select>
        </div>
        <div class="row gap">
          <label>制限時間
            <select id="turnSeconds"><option value="0">なし</option><option value="30">30秒</option><option value="60" selected>60秒</option><option value="90">90秒</option><option value="120">120秒</option></select>
          </label>
          <button id="startBtn" class="primary">ゲーム開始</button>
        </div>
      </div>
      <p id="lobbyMessage" class="message"></p>
    </div>
  </section>

  <section id="gameScreen" class="screen game-screen">
    <div id="playersBar" class="players-bar"></div>
    <div id="field" class="field">
      <div id="setsArea" class="sets-area"></div>
    </div>
    <div id="holdZone" class="hold-zone" aria-label="保留"><div id="hold" class="hold"></div></div>
    <div id="draftTools" class="draft-tools">
      <span id="initialStatus" class="initial-status"></span>
      <button id="undoBtn">↶ 戻す</button>
      <button id="redoBtn">↷ やり直す</button>
      <button id="resetDraftBtn">リセット</button>
      <span class="tool-spacer"></span>
      <span id="poolText" class="pool-text"></span>
      <button id="drawBtn">1枚引く</button>
      <button id="confirmBtn" class="primary">確定</button>
    </div>
    <div class="hand-area">
      <div class="hand-head"><span>自分の手札 <b id="handCount"></b></span><div class="row gap compact"><button data-sort="number">数字順</button><button data-sort="color">色順</button><button data-sort="free">自由順</button></div></div>
      <div id="hand" class="hand"></div>
    </div>
    <p id="gameMessage" class="message"></p>
  </section>


  <div id="turnPopup" class="turn-popup hidden" role="status" aria-live="polite">
    <div id="turnPopupText" class="turn-popup-text"></div>
  </div>


  <aside id="logPanel" class="log-panel hidden" aria-label="ログ">
    <div class="log-panel-head"><h2>ログ</h2><button id="logCloseBtn" class="icon-btn" aria-label="閉じる">×</button></div>
    <div id="logList" class="log-list"></div>
  </aside>

  <section id="resultOverlay" class="result-overlay hidden">
    <div class="result-card"><h2>RUMMIKUB!</h2><div id="resultBody"></div><button id="backLobbyBtn" class="primary">ロビーへ戻る</button></div>
  </section>

  <section id="infoOverlay" class="info-overlay hidden" aria-modal="true" role="dialog">
    <div class="info-card">
      <div class="info-head"><h2 id="infoTitle"></h2><button id="infoCloseBtn" class="icon-btn" aria-label="閉じる">×</button></div>
      <div id="infoBody" class="info-body"></div>
    </div>
  </section>
</main>
<script src="./app.js"></script>
</body>
</html>
